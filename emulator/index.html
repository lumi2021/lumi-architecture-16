<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>LA16 - Emulator</title>

        <link href="style.css" rel="stylesheet" />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.6/require.min.js"></script>
    </head>
    <body>

        <div class="container">
            <div class="left">
                <div id="editor"></div>
            </div>

            <div class="right">
                <div class="cpu">
                    <h1>CPU</h1>
                    <table class="registers">
                        <tbody>
                            <tr>
                                <td class="regn">A</td> <td>0x1234</td>
                                <td class="regn">B</td> <td>0x5678</td>
                                <td class="regn">C</td> <td>0x5678</td>
                            </tr>

                            <tr>
                                <td class="regn">D</td> <td>0x5678</td>
                                <td class="regn">E</td> <td>0x5678</td>
                            </tr>

                            <tr>
                                <td class="regn">IP</td> <td>0x5678</td>
                                <td class="regn">SP</td> <td>0x5678</td>
                                <td class="regn">BP</td> <td>0x5678</td>
                            </tr>
                            <tr>
                                <td class="regn">Flags</td> <td>ZNCOIH</td>
                                <td class="regn">Int</td>   <td>0x00</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <script type="module" src="script.mjs"></script>
    </body>
</html>
